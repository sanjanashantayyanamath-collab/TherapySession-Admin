name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        package: [server, client]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    services:
      mongo:
        image: mongo:8
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}).ok }' | grep 1"
          --health-interval 5s --health-timeout 10s --health-retries 20 --health-start-period 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - if: matrix.package == 'client'
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: server
      - run: npm audit --omit=dev --audit-level=high
        working-directory: client
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build
      - run: docker build -t therapysession-api ./server
      - run: docker build -t therapysession-web ./client
